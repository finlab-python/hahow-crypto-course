name: weekly

# GitHub-hosted runners are in the US, where api.binance.com answers HTTP 451 (the reason the
# 2020 Colab notebooks broke). Every run here proves the course works from a US machine such as Colab.
on:
  schedule:
    - cron: '0 2 * * 1'  # Mondays 02:00 UTC
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FINLAB_CRYPTO_VERSION: '0.3.0'
  MPLBACKEND: Agg

jobs:
  package-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: finlab-python/finlab_crypto
          ref: v${{ env.FINLAB_CRYPTO_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # 3.13 matches Google Colab; 3.12 matches the supported local setup
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt papermill ipykernel
      - name: Run every notebook with QUICK_RUN=True
        run: |
          mkdir -p executed
          run() {
            papermill "$1" "executed/$1" -p QUICK_RUN True --cwd . --kernel python3 --execution-timeout 1800
          }
          failed=()
          for notebook in *.ipynb; do
            echo "::group::$notebook"
            # one retry: a busy runner can occasionally lose a kernel message and stall a cell
            if ! run "$notebook" && ! run "$notebook"; then
              failed+=("$notebook")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed notebooks: ${failed[*]}"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executed-notebooks-py${{ matrix.python-version }}
          path: executed/
